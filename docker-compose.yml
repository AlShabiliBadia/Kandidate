services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kandidate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  service-file-parser:
    build:
      context: .
      dockerfile: ./services/service-file-parser/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - uploads:/uploads
    depends_on:
      - rabbitmq
    restart: unless-stopped

  service-ai-analyzer:
    build:
      context: .
      dockerfile: ./services/service-ai-analyzer/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - rabbitmq
    restart: unless-stopped

  service-backend:
    build:
      context: .
      dockerfile: ./services/service-backend/Dockerfile
    container_name: service-backend
    ports:
      - "8000:80"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      UPLOAD_VOLUME_PATH: /uploads
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kandidate}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - uploads:/uploads
    depends_on:
      - rabbitmq
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
